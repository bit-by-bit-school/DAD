<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HackerRank Solutions</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="brand-icon">
          <!-- Authentic 3-Cell 16-Segment Alphanumeric Display Logo spelling DAD -->
          <svg viewBox="0 0 70 28" width="55" height="22" fill="none" shape-rendering="crispEdges"
            xmlns="http://www.w3.org/2000/svg" class="hr-icon-logo" role="img" aria-label="DAD Logo">
            <defs>
              <g id="seg-cell-pop" transform="skewX(-7)">
                <g stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" stroke-linecap="square"
                  stroke-linejoin="miter">
                  <line x1="2" y1="2" x2="16" y2="2" />
                  <line x1="16" y1="2" x2="16" y2="13" />
                  <line x1="16" y1="13" x2="16" y2="24" />
                  <line x1="16" y1="24" x2="2" y2="24" />
                  <line x1="2" y1="24" x2="2" y2="13" />
                  <line x1="2" y1="13" x2="2" y2="2" />
                  <line x1="2" y1="13" x2="16" y2="13" />
                  <line x1="9" y1="2" x2="9" y2="13" />
                  <line x1="9" y1="13" x2="9" y2="24" />
                  <line x1="2" y1="2" x2="9" y2="13" />
                  <line x1="16" y1="2" x2="9" y2="13" />
                  <line x1="9" y1="13" x2="2" y2="24" />
                  <line x1="9" y1="13" x2="16" y2="24" />
                  <!-- D Right Chamfer Segments -->
                  <line x1="11" y1="2" x2="16" y2="7" />
                  <line x1="16" y1="19" x2="11" y2="24" />
                  <rect x="18" y="23" width="1.5" height="1.5" fill="rgba(255, 255, 255, 0.12)" />
                </g>
              </g>
            </defs>

            <!-- Letter 1: 'D' (Cyan Phosphor - Distinct D-curve with flat spine) -->
            <g transform="translate(3, 1)">
              <use href="#seg-cell-pop" x="0" y="0" />
              <g stroke="var(--color-brand, #00E5FF)" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"
                filter="drop-shadow(0 0 3px var(--color-brand, #00E5FF))" transform="skewX(-7)">
                <polyline points="2,24 2,2 11,2 16,7 16,19 11,24 2,24" fill="none" />
              </g>
              <rect x="18" y="23" width="1.5" height="1.5" fill="var(--color-brand, #00E5FF)" transform="skewX(-7)" />
            </g>

            <!-- Letter 2: 'A' (White Phosphor) -->
            <g transform="translate(26, 1)">
              <use href="#seg-cell-pop" x="0" y="0" />
              <g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter" filter="drop-shadow(0 0 3px #FFFFFF)"
                transform="skewX(-7)">
                <line x1="2" y1="2" x2="2" y2="24" />
                <line x1="2" y1="2" x2="16" y2="2" />
                <line x1="16" y1="2" x2="16" y2="24" />
                <line x1="2" y1="13" x2="16" y2="13" />
              </g>
              <rect x="18" y="23" width="1.5" height="1.5" fill="#FFFFFF" transform="skewX(-7)" />
            </g>

            <!-- Letter 3: 'D' (Cyan Phosphor - Distinct D-curve with flat spine) -->
            <g transform="translate(49, 1)">
              <use href="#seg-cell-pop" x="0" y="0" />
              <g stroke="var(--color-brand, #00E5FF)" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="miter"
                filter="drop-shadow(0 0 3px var(--color-brand, #00E5FF))" transform="skewX(-7)">
                <polyline points="2,24 2,2 11,2 16,7 16,19 11,24 2,24" fill="none" />
              </g>
              <rect x="18" y="23" width="1.5" height="1.5" fill="var(--color-brand, #00E5FF)" transform="skewX(-7)" />
            </g>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Solutions Hub</h1>
        </div>
      </div>
      <div id="auth-status-badge" class="auth-badge checking" title="Checking login status">
        <span class="status-dot"></span>
        <span class="status-text">Checking login...</span>
      </div>
    </header>

    <!-- Platform Selector Tabs -->
    <div class="platform-tabs">
      <button type="button" id="tab-hackerrank" class="platform-tab active" data-platform="hackerrank">
        <span class="tab-dot dot-hackerrank"></span> HackerRank
      </button>
      <button type="button" id="tab-leetcode" class="platform-tab" data-platform="leetcode">
        <span class="tab-dot dot-leetcode"></span> LeetCode
      </button>
      <button type="button" id="tab-all" class="platform-tab" data-platform="all">
        <span class="tab-dot dot-all"></span> All
      </button>
    </div>

    <!-- Main Content -->
    <main class="popup-content">
      <!-- Fetch Card -->
      <section class="card fetch-card">
        <div class="card-header">
          <div class="card-title-group">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" class="card-header-svg">
              <path
                d="M4 13h8v6h2v2h-2v2h-2v-8H2v-4h2v2Zm12 6h-2v-2h2v2Zm2-2h-2v-2h2v2Zm2-2h-2v-2h2v2Zm-6-6h8v4h-2v-2h-8V5h-2V3h2V1h2v8Zm-8 2H4V9h2v2Zm2-2H6V7h2v2Zm2-2H8V5h2v2Z" />
            </svg>
            <h2>Fetch User Solutions</h2>
          </div>
          <span class="card-hint">Download code</span>
        </div>

        <form id="fetch-form" class="fetch-form">
          <div class="input-group">
            <label for="username-input">HackerRank Username</label>
            <div class="input-wrapper">
              <span class="input-icon">@</span>
              <input type="text" id="username-input" placeholder="e.g. nmeera2024" autocomplete="off" spellcheck="false"
                required />
            </div>
          </div>

          <!-- Quick user chips -->
          <div class="recent-users-section">
            <span class="recent-label">Tracked:</span>
            <div id="user-chips-container" class="chips-container">
              <!-- Dynamically populated -->
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="button-row">
            <button type="submit" id="fetch-btn" class="btn btn-primary">
              <span class="btn-icon">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                  <path
                    d="M4 13h8v6h2v2h-2v2h-2v-8H2v-4h2v2Zm12 6h-2v-2h2v2Zm2-2h-2v-2h2v2Zm2-2h-2v-2h2v2Zm-6-6h8v4h-2v-2h-8V5h-2V3h2V1h2v8Zm-8 2H4V9h2v2Zm2-2H6V7h2v2Zm2-2H8V5h2v2Z" />
                </svg>
              </span>
              <span class="btn-label">Fetch Solutions</span>
            </button>
            <button type="button" id="cancel-btn" class="btn btn-secondary hidden">
              Cancel
            </button>
          </div>
        </form>

        <!-- Progress Indicator (Hidden by default) -->
        <div id="progress-section" class="progress-section hidden">
          <div class="progress-info">
            <span id="progress-status-text" class="progress-status">Downloading...</span>
            <span id="progress-percent" class="progress-percent segment-font">0%</span>
          </div>
          <div class="progress-bar-track">
            <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
          <div class="progress-stats">
            <span class="stat-badge stat-solved"><strong id="stat-solved-count">0</strong> Solved</span>
            <span class="stat-badge stat-skipped"><strong id="stat-skipped-count">0</strong> Skipped</span>
            <span class="stat-badge stat-total"><strong id="stat-current-index">0</strong>/<span
                id="stat-total-count">0</span></span>
          </div>
          <div id="current-challenge-label" class="current-challenge">Checking: ...</div>
        </div>

        <!-- Success/Error Alert (Hidden by default) -->
        <div id="fetch-alert" class="alert hidden">
          <span class="alert-icon"></span>
          <span id="alert-message" class="alert-text"></span>
        </div>
      </section>

      <!-- Server Auto-Sync Section (Local / Production) -->
      <section class="card server-card">
        <div class="card-header">
          <div class="card-title-group">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" class="card-header-svg">
              <path d="M16 4h2v6h-2zm-2-2h2v2h-2zm0 2h2v8h-2zM4 8H2v5h2z" />
              <path d="M4 6h16v2H4zm4 14H6v-6h2zm2 2H8v-2h2zm0-2H8v-8h2zm10-4h2v-5h-2z" />
              <path d="M20 18H4v-2h16z" />
            </svg>
            <h2>Server Auto-Sync</h2>
          </div>
          <span id="sync-status-badge" class="card-hint">Offline / Unset</span>
        </div>
        <div class="server-sync-form">
          <div class="input-group">
            <label for="server-url-input">Server URL (Prod / Local)</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
              </span>
              <input type="url" id="server-url-input" placeholder="http://localhost:3000 or https://your-prod-server.com" autocomplete="off" spellcheck="false" />
            </div>
          </div>
          <div class="input-group">
            <label for="server-token-input">Server Auth Token</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
                  <path
                    d="M11 18H3V16H11V18ZM23 15H21V18H17V16H19V13H21V11H11V8H13V9H23V15ZM3 16H1V8H3V16ZM17 16H15V15H13V16H11V13H17V16ZM9 14H5V10H9V14ZM11 8H3V6H11V8Z" />
                </svg>
              </span>
              <input type="password" id="server-token-input" placeholder="e.g. hr_admin_master_token_2026"
                autocomplete="off" />
            </div>
          </div>
          <div class="button-row">
            <button type="button" id="save-token-btn" class="btn btn-secondary">Save Config</button>
            <button type="button" id="sync-now-btn" class="btn btn-emerald">Sync Now</button>
          </div>
          <div id="sync-alert" class="alert hidden"></div>
        </div>
      </section>

      <!-- Database Summary Card -->
      <section class="card stats-card">
        <div class="card-header">
          <div class="card-title-group">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" class="card-header-svg">
              <path d="M4 2h16v2H4zm0 18h16v2H4zM2 4h2v16H2zm18 0h2v16h-2z" />
            </svg>
            <h2>Storage Matrix</h2>
          </div>
          <span id="db-status-label" class="card-hint">Local storage</span>
        </div>

        <div class="metric-grid">
          <div class="metric-box">
            <span id="metric-total-problems" class="metric-value segment-font">442</span>
            <span class="metric-label">Problems</span>
          </div>
          <div class="metric-box">
            <span id="metric-total-solutions" class="metric-value segment-font text-emerald">404</span>
            <span class="metric-label">Solutions</span>
          </div>
          <div class="metric-box">
            <span id="metric-total-users" class="metric-value segment-font text-brand">6</span>
            <span class="metric-label">Users</span>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer Action -->
    <footer class="popup-footer">
      <button id="open-dashboard-btn" class="btn btn-full btn-accent">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
          <path
            d="M11 18H9v-4h2v4Zm-4-1H5v-2h2v2Zm12-2v2h-2v-2h2ZM5 15H3v-2h2v2Zm16 0h-2v-2h2v2Zm-8-1h-2v-4h2v4ZM3 13H1v-2h2v2Zm20 0h-2v-2h2v2ZM5 11H3V9h2v2Zm16 0h-2V9h2v2Zm-6-1h-2V6h2v4ZM7 9H5V7h2v2Zm12 0h-2V7h2v2Z" />
        </svg>
        <span>Open Solutions Workspace</span>
      </button>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="../data/seed-data.js"></script>
  <script src="../data/problems-list.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="../lib/api.js"></script>
  <script src="../lib/leetcode-api.js"></script>
  <script src="../lib/sync.js"></script>
  <script src="../lib/icons.js"></script>
  <script src="popup.js"></script>
</body>

</html>
