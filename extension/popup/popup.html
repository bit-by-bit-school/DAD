<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HackerRank Solutions</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="logo-icon" id="popup-logo-icon">
          <!-- Precision 6-Unit 16-Segment Staircase Logo -->
          <svg viewBox="0 0 72 72" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg" class="hr-icon-logo">
            <defs>
              <g id="seg-cell-pop" transform="skewX(-8)">
                <g stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="2" y1="1" x2="10" y2="1"/>
                  <line x1="10" y1="1" x2="10" y2="9"/>
                  <line x1="10" y1="9" x2="10" y2="17"/>
                  <line x1="10" y1="17" x2="2" y2="17"/>
                  <line x1="2" y1="17" x2="2" y2="9"/>
                  <line x1="2" y1="9" x2="2" y2="1"/>
                  <line x1="2" y1="9" x2="10" y2="9"/>
                  <line x1="6" y1="1" x2="6" y2="9"/>
                  <line x1="6" y1="9" x2="6" y2="17"/>
                  <line x1="2" y1="1" x2="6" y2="9"/>
                  <line x1="10" y1="1" x2="6" y2="9"/>
                  <line x1="6" y1="9" x2="2" y2="17"/>
                  <line x1="6" y1="9" x2="10" y2="17"/>
                  <circle cx="12.5" cy="17" r="0.9" fill="rgba(255, 255, 255, 0.15)"/>
                </g>
              </g>
            </defs>
            <g transform="translate(6, 26)">
              <use href="#seg-cell-pop" x="0" y="0"/>
              <path d="M4 1v8M4 9v8" stroke="var(--color-brand, #00E5FF)" stroke-width="2" stroke-linecap="round" filter="drop-shadow(0 0 3px var(--color-brand, #00E5FF))"/>
              <use href="#seg-cell-pop" x="0" y="20"/>
              <path d="M4 21h8M4 21v8M12 29v8M4 37h8M4 29h8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" filter="drop-shadow(0 0 3px #FFFFFF)"/>
              <circle cx="14.5" cy="37" r="1.1" fill="var(--color-brand, #00E5FF)"/>
            </g>
            <g transform="translate(26, 14)">
              <use href="#seg-cell-pop" x="0" y="0"/>
              <path d="M4 1v8M4 9h8M12 9v8" stroke="var(--color-brand, #00E5FF)" stroke-width="2" stroke-linecap="round" filter="drop-shadow(0 0 3px var(--color-brand, #00E5FF))"/>
              <use href="#seg-cell-pop" x="0" y="20"/>
              <path d="M4 21h8M12 21v8M4 29h8M4 29v8M4 37h8M12 29v8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" filter="drop-shadow(0 0 3px #FFFFFF)"/>
              <circle cx="14.5" cy="37" r="1.1" fill="#FFFFFF"/>
            </g>
            <g transform="translate(46, 2)">
              <use href="#seg-cell-pop" x="0" y="0"/>
              <path d="M4 1v8M4 9v8M12 1v8M12 9v8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" filter="drop-shadow(0 0 3px #FFFFFF)"/>
              <use href="#seg-cell-pop" x="0" y="20"/>
              <path d="M4 21h8M4 21v8M4 29h8M12 29v8M4 37h8" stroke="var(--color-brand, #00E5FF)" stroke-width="2" stroke-linecap="round" filter="drop-shadow(0 0 3px var(--color-brand, #00E5FF))"/>
              <circle cx="14.5" cy="37" r="1.1" fill="var(--color-brand, #00E5FF)"/>
            </g>
          </svg>
        </div>
        <div class="brand-text">
          <h1>HackerRank Hub</h1>
          <span class="badge-tag">v1.0</span>
        </div>
      </div>
      <div id="auth-status-badge" class="auth-badge checking" title="Checking HackerRank login status">
        <span class="status-dot"></span>
        <span class="status-text">Checking login...</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="popup-content">
      <!-- Fetch Card -->
      <section class="card fetch-card">
        <div class="card-header">
          <div class="card-title-group">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="card-header-svg">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            <h2>Fetch User Solutions</h2>
          </div>
          <span class="card-hint">Download code</span>
        </div>

        <form id="fetch-form" class="fetch-form">
          <div class="input-group">
            <label for="username-input">HackerRank Username</label>
            <div class="input-wrapper">
              <span class="input-icon">@</span>
              <input 
                type="text" 
                id="username-input" 
                placeholder="e.g. nmeera2024" 
                autocomplete="off" 
                spellcheck="false" 
                required
              />
            </div>
          </div>

          <!-- Quick user chips -->
          <div class="recent-users-section">
            <span class="recent-label">Tracked:</span>
            <div id="user-chips-container" class="chips-container">
              <!-- Dynamically populated -->
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="button-row">
            <button type="submit" id="fetch-btn" class="btn btn-primary">
              <span class="btn-icon">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
              </span>
              <span class="btn-label">Fetch Solutions</span>
            </button>
            <button type="button" id="cancel-btn" class="btn btn-secondary hidden">
              Cancel
            </button>
          </div>
        </form>

        <!-- Progress Indicator (Hidden by default) -->
        <div id="progress-section" class="progress-section hidden">
          <div class="progress-info">
            <span id="progress-status-text" class="progress-status">Starting download...</span>
            <span id="progress-percent" class="progress-percent segment-font">0%</span>
          </div>
          <div class="progress-bar-track">
            <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
          <div class="progress-stats">
            <span class="stat-badge stat-solved"><strong id="stat-solved-count">0</strong> Solved</span>
            <span class="stat-badge stat-skipped"><strong id="stat-skipped-count">0</strong> Skipped</span>
            <span class="stat-badge stat-total"><strong id="stat-current-index">0</strong>/<span id="stat-total-count">0</span></span>
          </div>
          <div id="current-challenge-label" class="current-challenge">Checking: ...</div>
        </div>

        <!-- Success/Error Alert (Hidden by default) -->
        <div id="fetch-alert" class="alert hidden">
          <span class="alert-icon"></span>
          <span id="alert-message" class="alert-text"></span>
        </div>
      </section>

      <!-- Local Backend Server Sync Section -->
      <section class="card server-card">
        <div class="card-header">
          <div class="card-title-group">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="card-header-svg">
              <polyline points="23 4 23 10 17 10"/>
              <polyline points="1 20 1 14 7 14"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
            <h2>Local Server Auto-Sync</h2>
          </div>
          <span id="sync-status-badge" class="card-hint">Offline / Unset</span>
        </div>
        <div class="server-sync-form">
          <div class="input-group">
            <label for="server-token-input">Server Auth Token</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 2l-2 2m-1.5 1.5L14 9l-3-3-4.5 4.5a5.5 5.5 0 1 0 7.78 7.78L22 10.5V6l-2-2z"/>
                </svg>
              </span>
              <input 
                type="password" 
                id="server-token-input" 
                placeholder="e.g. hr_admin_master_token_2026" 
                autocomplete="off"
              />
            </div>
          </div>
          <div class="button-row">
            <button type="button" id="save-token-btn" class="btn btn-secondary">Save Token</button>
            <button type="button" id="sync-now-btn" class="btn btn-emerald">Sync Now</button>
          </div>
          <div id="sync-alert" class="alert hidden"></div>
        </div>
      </section>

      <!-- Database Summary Card -->
      <section class="card stats-card">
        <div class="card-header">
          <div class="card-title-group">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="card-header-svg">
              <ellipse cx="12" cy="5" rx="9" ry="3"/>
              <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
            </svg>
            <h2>Storage Matrix</h2>
          </div>
          <span id="db-status-label" class="card-hint">Local storage</span>
        </div>

        <div class="metric-grid">
          <div class="metric-box">
            <span id="metric-total-problems" class="metric-value segment-font">442</span>
            <span class="metric-label">Problems</span>
          </div>
          <div class="metric-box">
            <span id="metric-total-solutions" class="metric-value segment-font text-emerald">404</span>
            <span class="metric-label">Solutions</span>
          </div>
          <div class="metric-box">
            <span id="metric-total-users" class="metric-value segment-font text-brand">6</span>
            <span class="metric-label">Users</span>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer Action -->
    <footer class="popup-footer">
      <button id="open-dashboard-btn" class="btn btn-full btn-accent">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
          <path d="M7 8l3 3-3 3M13 14h4"/>
        </svg>
        <span>Open Solutions Workspace</span>
      </button>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="../data/seed-data.js"></script>
  <script src="../data/problems-list.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="../lib/api.js"></script>
  <script src="../lib/sync.js"></script>
  <script src="../lib/icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
